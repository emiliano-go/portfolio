server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    # Astro builds directory-style routes, so /en/projects resolves to
    # /en/projects/index.html.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Without this nginx serves its own bare 404 page instead of the styled one.
    error_page 404 /en/404/index.html;
    location = /en/404/index.html {
        internal;
    }

    location /i18n/ {
        add_header Cache-Control "public, max-age=3600";
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;
}
