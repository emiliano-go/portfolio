server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com" always;

    # Keep the container deployment in step with public/_headers (the Cloudflare
    # Pages deployment is the production one). Agent discovery per RFC 8288/9727.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Vary "Accept" always;
    add_header Link "</.well-known/api-catalog>; rel=\"api-catalog\"; type=\"application/linkset+json\", </.well-known/ai-catalog.json>; rel=\"describedby\"; type=\"application/json\", </openapi.json>; rel=\"service-desc\"; type=\"application/vnd.oai.openapi+json\", </api.md>; rel=\"service-doc\"; type=\"text/markdown\", </.well-known/mcp/server-card.json>; rel=\"service-meta\"; type=\"application/mcp-server-card+json\", </llms.txt>; rel=\"alternate\"; type=\"text/markdown\"" always;

    # Astro builds directory-style routes, so /en/projects resolves to
    # /en/projects/index.html. Requests that asked for Markdown are rewritten to
    # the prebuilt twin (scripts/generate_markdown.py) so this image answers the
    # same way as the Cloudflare Pages deployment; the negative lookahead keeps
    # the rewritten .md request from matching again.
    location / {
        if ($http_accept ~* "text/markdown") {
            rewrite ^(?!.*\.md$)(.*?)/?$ $1/index.md last;
        }
        try_files $uri $uri/ $uri/index.html =404;
    }

    # default_type covers `.md`, which the stock mime.types does not map.
    location ~* \.md$ {
        default_type text/markdown;
    }

    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        try_files $uri =404;
    }

    location = /.well-known/oauth-protected-resource {
        default_type application/json;
        try_files $uri =404;
    }

    # Without this nginx serves its own bare 404 page instead of the styled one.
    error_page 404 /en/404/index.html;
    location = /en/404/index.html {
        internal;
    }

    location /i18n/ {
        add_header Cache-Control "public, max-age=3600";
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;
}
